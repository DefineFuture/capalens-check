[project]
name = "capalens-check"
version = "0.1.0"
description = "Read-only checks for AI integrations: MCP servers, OpenAPI documents, A2A Agent Cards and Agent Skills. Evidence, not scores."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "南京定义未来科技有限公司 (Nanjing Define Future Technology Co., Ltd.)", email = "Capalens@deffuture.com" }]
keywords = ["mcp", "model-context-protocol", "openapi", "a2a", "agent-skills", "ai-agents", "security", "conformance", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []  # standard library only

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.7", "mypy>=1.13", "jsonschema>=4.23"]

[project.urls]
Homepage = "https://capalens.com"
Repository = "https://github.com/DefineFuture/capalens-check"
Documentation = "https://github.com/DefineFuture/capalens-check/tree/main/docs"
Issues = "https://github.com/DefineFuture/capalens-check/issues"
Changelog = "https://github.com/DefineFuture/capalens-check/blob/main/CHANGELOG.md"
Security = "https://github.com/DefineFuture/capalens-check/blob/main/SECURITY.md"

[project.scripts]
capalens-check = "capalens_check.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capalens_check"]

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "docs/", "examples/", "schemas/", "action.yml", "Dockerfile",
    "README.md", "README.zh-CN.md", "LICENSE", "NOTICE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md", "CITATION.cff", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/capalens_check/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S310", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["capalens_check", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"src/capalens_check/checks.py" = ["E501"]  # a table, one check per entry

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/capalens_check"]
exclude = ["src/capalens_check/data/"]
