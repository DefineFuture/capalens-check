name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,yaml]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev,yaml]"
      - run: python -m pytest
      - name: Demo (local loopback server only)
        run: capalens-check demo

  action:
    name: The action on the bundled examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OpenAPI document
        uses: ./
        with:
          kind: openapi
          target: examples/openapi/petstore.json
      - name: Targets file (static examples)
        uses: ./
        with:
          kind: run
          target: examples/targets.json
          fail-on: review

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel and run it
        run: |
          python -m pip install dist/*.whl
          capalens-check --version
          capalens-check checks
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
