name: CapaLens IA Check
description: Read-only checks for Intelligent Access (IA) - MCP servers, OpenAPI documents, A2A Agent Cards and Agent Skills. Evidence for every result, no scores.
author: Nanjing Define Future Technology Co., Ltd.
branding:
  icon: check-circle
  color: blue

inputs:
  kind:
    description: "What to check: mcp, openapi, agent-card, skill, or run (a targets file)."
    required: true
  target:
    description: "A URL (mcp, openapi, agent-card), a file, a skill directory, or a targets file (run)."
    required: true
  fail-on:
    description: "Fail the step when a result is at or above: fail (default), review, unknown, never."
    required: false
    default: fail
  baseline:
    description: "An earlier JSON report. Changed MCP tool definitions become review candidates (SEC-004). Ignored if the file does not exist."
    required: false
    default: ""
  bearer-token:
    description: "Token sent as 'Authorization: Bearer ...' (single target only). Pass a secret; it is never printed."
    required: false
    default: ""
  json-file:
    description: "Where to write the JSON report."
    required: false
    default: capalens-ia-check.json
  sarif-file:
    description: "Where to write the SARIF report (upload it with github/codeql-action/upload-sarif)."
    required: false
    default: capalens-ia-check.sarif
  python-version:
    description: "Python used to run the checks."
    required: false
    default: "3.12"

outputs:
  json-file:
    description: "Path of the JSON report."
    value: ${{ inputs.json-file }}
  sarif-file:
    description: "Path of the SARIF report."
    value: ${{ inputs.sarif-file }}
  exit-code:
    description: "0 nothing at or above fail-on, 1 something is, 2 usage or input error."
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install capalens-ia-check from this action
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "${ACTION_PATH}[yaml]"

    - name: Run capalens-ia-check
      id: check
      shell: bash
      # Inputs reach the script through the environment only, never by template expansion.
      env:
        IN_KIND: ${{ inputs.kind }}
        IN_TARGET: ${{ inputs.target }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_JSON: ${{ inputs.json-file }}
        IN_SARIF: ${{ inputs.sarif-file }}
        CAPALENS_ACTION_TOKEN: ${{ inputs.bearer-token }}
      run: |
        set +e
        args=("$IN_KIND" "$IN_TARGET" --fail-on "$IN_FAIL_ON" --json-out "$IN_JSON" --sarif-out "$IN_SARIF")
        if [ -n "$IN_BASELINE" ]; then
          if [ -f "$IN_BASELINE" ]; then args+=(--baseline "$IN_BASELINE"); else echo "::notice::baseline $IN_BASELINE not found; first run"; fi
        fi
        if [ -n "$CAPALENS_ACTION_TOKEN" ]; then args+=(--bearer-env CAPALENS_ACTION_TOKEN); fi
        capalens-ia-check "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Apply fail-on
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: |
        if [ "$CODE" = "2" ]; then echo "::error::capalens-ia-check: usage or input error"; fi
        exit "$CODE"
