# Check your own OpenAPI document, Agent Card and Agent Skills on every pull request, and show the
# results in the code scanning view. Copy to .github/workflows/ and list your files in
# capalens-targets.json (see examples/targets.json): one run gives one SARIF file.

name: CapaLens check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload SARIF
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the documents in capalens-targets.json
        uses: Capalens/capalens-check@v0
        with:
          kind: run
          target: capalens-targets.json
          sarif-file: capalens.sarif

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: capalens.sarif
          category: capalens-check
